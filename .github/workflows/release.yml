# Copied from LukeNeedham/ci-workflows (callers/release.yml). Do not edit it here: change it there.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, as major.minor.patch (e.g. 0.3.0)'
        required: true
        type: string
      notes:
        description: 'Release notes (leave empty to list the merged PRs)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    uses: LukeNeedham/ci-workflows/.github/workflows/android_release.yml@main
    with:
      version: ${{ inputs.version }}
      notes: ${{ inputs.notes }}
    secrets: inherit
